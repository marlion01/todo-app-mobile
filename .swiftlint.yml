included:
  - TodoApp
  - TodoAppTests
  - TodoAppUITests

excluded:
  - build
  - DerivedData
  - .build
  - Pods
  - TodoApp.xcodeproj

disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 1
  excluded:
    - id

type_name:
  min_length: 3
  max_length:
    warning: 60
    error: 80

file_length:
  warning: 500
  error: 1000
