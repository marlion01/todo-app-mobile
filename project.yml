name: TodoApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  TodoApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TodoApp
    resources:
      - path: TodoApp/Resources/Assets.xcassets
    info:
      path: TodoApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: TodoApp
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.todoapp
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO

  TodoAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TodoAppTests
    dependencies:
      - target: TodoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.todoapp.tests
        GENERATE_INFOPLIST_FILE: YES

  TodoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TodoAppUITests
    dependencies:
      - target: TodoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.todoapp.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TodoApp:
    build:
      targets:
        TodoApp: all
        TodoAppTests: [test]
        TodoAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TodoAppTests
        - TodoAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
